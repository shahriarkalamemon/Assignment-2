<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout Using - CSS Flexbox</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="main-left">
            <div class="main-left-top"></div>
            <div class="main-left-bottom"></div>
        </div>
        <div class="main-right">
            <div class="main-right-top">
                <div class="main-right-top-left"></div>
                <div class="main-right-top-right"></div>
            </div>
            <div class="main-right-bottom">
                <div class="main-right-bottom-left">
                    <div class="middle-top">
                        <div class="middle-top-left"></div>
                        <div class="middle-top-right"></div>
                    </div>
                    <div class="middle-bottom">
                        <div class="middle-bottom-left"></div>
                        <div class="middle-bottom-right"></div>
                    </div>
                </div>
                <div class="main-right-bottom-right"></div>
            </div>
        </div>
    </div>
</body>
</html>
